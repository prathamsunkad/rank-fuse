# Llama-3.1-8B projection shapes: the kernels were tuned on 4096 x 4096 only. r_max 256 is the
# MatryoshkaLoRA paper's setting for this model.
name: rf2_shapes
impls: [rf1_fused, rf2_segment, rf2_segment_fw, rf2_bucketed, b1_padded, rf1_fused]
timing: graph
mode: add
warmup: 10
reps: 30
graph_replays: 20
flush_l2: true
shapes:
  q_o: [4096, 4096]
  k_v: [4096, 1024]
  gate_up: [4096, 14336]
  down: [14336, 4096]
batches: [[8, 1], [128, 1], [2048, 1], [8192, 1], [16, 512]]
grid:
  r_max: [64, 256]
  tiers: pow2
  dist: [uniform, skew_low]
  request_order: [random, sorted]
  dtype: fp16
  seed: [0, 1, 2]
