# Decode on Llama-3.1-8B projection shapes (hidden 4096, intermediate 14336, 8 KV heads x 128).
# q and o share a shape, as do k/v and gate/up. Confirm against the model's config.json.
name: llama3-8b-decode
impls: all
warmup: 20
reps: 200
flush_l2: true
shapes:            # projection: [h_in, h_out]
  q_o: [4096, 4096]
  k_v: [4096, 1024]
  gate_up: [4096, 14336]
  down: [14336, 4096]
grid:
  num_requests: [1, 2, 4, 8, 16, 32, 64, 128, 256]
  tokens_per_request: 1
  r_max: [64, 128]
  dist: [all_min, all_max, uniform, skew_low, skew_high]
  dtype: fp16
