# Pratham's H200 one-layer sweep (results/h200_2026-10-25, tables 01 and 07), re-run from the repo
# code on another GPU, with B2 added. His runs came from prototypes outside the repo
# (~/scratch/rankfuse/checks), so this checks that the numbers reproduce and that the
# H200-tuned RF1 constants carry over.
#   sbatch -t 02:00:00 --export=ALL,CONFIG=bench/configs/h200_replica.yaml scripts/phoenix/sweep.sbatch
# Same as his: 4096 x 4096, fp16, r_max 64 with the default 7 tiers (1, 2, ..., 64), uniform /
# skew_low / skew_high mixes, decode token counts of tables 01 and 07, the prefill batch shapes of
# table 07, graph timing as 7 runs of 50 replays. Differences: every mix on every batch (his
# skew_high skipped >= 512 decode tokens), seeds 0-2 (he ran one), B2 / B2g added, no B3 (needs
# vLLM). Ranks are sampled, so batch maximum ranks will not match his rows one for one; the
# controlled-mix sweeps are sys_decode.yaml / sys_prefill.yaml.
name: h200_replica
impls: [b1_padded, b2_grouped, b2_grouped_graphed, rf1_single, rf1_fused, rf2_fused, rf2_segment]
timing: graph
warmup: 10
reps: 7
graph_replays: 50
flush_l2: true
batches:   # [num_requests, tokens_per_request]
  - [1, 1]
  - [8, 1]
  - [32, 1]
  - [128, 1]
  - [256, 1]
  - [512, 1]
  - [1024, 1]
  - [2048, 1]
  - [4096, 1]
  - [8192, 1]
  - [1, 2048]
  - [4, 512]
  - [16, 128]
  - [4, 2048]
  - [8, 1024]
  - [16, 512]
grid:
  h_in: 4096
  h_out: 4096
  r_max: 64
  dist: [uniform, skew_low, skew_high]
  dtype: fp16
  seed: [0, 1, 2]
