# The ideal bound for rf2_ideal and rf2_skew: rf1_fused with every request at rank 1 (the 16-row
# bucket), at the same sizes. This is the time if no request were at r_max. Single-rank batches are
# not reported as results; this config only supplies the "ideal" column.
name: rf2_ideal_bound
impls: [rf1_fused]
timing: graph
mode: add
warmup: 10
reps: 30
graph_replays: 20
flush_l2: true
batches: [[256, 1], [512, 1], [1024, 1], [2048, 1], [8192, 1], [16, 128], [32, 256], [16, 512]]
grid:
  h_in: 4096
  h_out: 4096
  r_max: [64, 128, 256]
  tiers: pow2
  dist: all_min
  request_order: random
  dtype: fp16
  seed: [0, 1, 2]
