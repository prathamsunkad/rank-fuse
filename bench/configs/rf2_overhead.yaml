# What RF2 costs when it has nothing to skip, down to one token: every request at one rank, so
# RF2 runs RF1's width and any gap is overhead. Steps: rf1_fused -> rank read -> one branch ->
# full width with every arm (rf2_segment_fw), and the same through the sorted index (rf2_index_fw).
# rf2_segment and rf2_index should match their _fw rows here. rf1_fused runs twice for noise.
name: rf2_overhead
impls: [rf1_fused, rf2_probe_read, rf2_probe_branch, rf2_segment_fw, rf2_segment, rf2_index_fw, rf2_index, b1_padded, rf1_fused]
timing: graph
mode: add
warmup: 10
reps: 30
graph_replays: 20
flush_l2: true
batches: [[1, 1], [8, 1], [32, 1], [128, 1], [512, 1], [8192, 1]]
grid:
  h_in: 4096
  h_out: 4096
  r_max: [64, 128, 256]
  tiers: pow2
  dist: [all_min, all_max]
  dtype: fp16
  seed: [0, 1, 2]
