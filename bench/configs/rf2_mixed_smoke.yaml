# Smoke run of rf2_mixed.yaml: one seed, 256 decodes, one rank mix, each step type's lengths, both
# request orders. Checks the whole path (batches, prepare, graph capture, CSV) runs on the GPU before
# the full sweep; look for "graph capture failed" in the log. Not for reporting.
name: rf2_mixed_smoke
impls: [rf1_fused, rf2_segment, rf2_index, rf2_ranges, rf2_bucketed_tuned, b1_padded, rf1_fused]
timing: graph
mode: add
warmup: 5
reps: 10
graph_replays: 10
flush_l2: true
common: &common
  num_requests: 256
  tokens_per_request: 1
  h_in: 4096
  h_out: 4096
  r_max: [128, 256]
  tiers: pow2
  dist: zipf_1
  request_order: [random, sorted]
  dtype: fp16
  seed: 0
grid:
  - <<: *common                                         # 1. decode only
  - <<: *common                                         # 2. one prompt fills the budget
    lengths: [chunked_2048_2048, chunked_8192_8192]
    prefill_dist: [null, all_max]
  - <<: *common                                         # 3. short prompts, budget not filled
    lengths: [serving_1_2048, serving_2_8192]
    prefill_dist: [null, all_max]
  - <<: *common                                         # 4. many partial prefills
    lengths: [chunked_2048_512, chunked_8192_512, chunked_8192_2048]
    prefill_dist: [null, all_max]
