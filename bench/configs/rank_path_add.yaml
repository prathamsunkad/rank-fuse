# Which step of the RF2 path costs time, with nothing to skip. Every kernel runs the batch's width:
# rf1_fused -> rf2_probe_read (rank read) -> rf2_probe_branch (one branch) -> rf2_segment_fw (the
# other widths' arms). rf1_fused runs twice for noise. Above 128 tokens only: smaller batches are
# unreliable until the L2-flush subtraction is fixed. Add-mode half of rank_path.yaml.
name: rank_path_add
impls: [rf1_fused, rf2_probe_read, rf2_probe_branch, rf2_segment_fw, rf2_segment, rf1_fused]
timing: graph
mode: add
warmup: 10
reps: 30
graph_replays: 20
flush_l2: true
batches: [[256, 1], [512, 1], [1024, 1], [2048, 1], [4096, 1], [8192, 1], [16, 512], [4, 2048]]
grid:
  h_in: 4096
  h_out: 4096
  r_max: [64, 128, 256]
  tiers: pow2
  dist: [all_min, all_max]
  dtype: fp16
  seed: [0, 1, 2]
