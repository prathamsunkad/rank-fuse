# Parity gate: batches with one rank, so there is nothing to skip. rf2_segment_fw should match
# rf1_fused; its gap is the cost of the rank read and branch, and rf1_fused listed twice gives the
# noise floor. Run in write and add mode (parity_add.yaml) before any other RF2 sweep.
name: parity
impls: [rf1_fused, rf2_segment, rf2_segment_fw, rf2_bucketed, rf2_bucketed_tuned, rf1_fused]
timing: graph
warmup: 10
reps: 30
graph_replays: 20
flush_l2: true
batches: [[1, 1], [8, 1], [32, 1], [128, 1], [512, 1], [2048, 1], [8192, 1], [16, 128], [16, 512], [4, 2048]]
grid:
  h_in: 4096
  h_out: 4096
  r_max: [64, 128, 256]
  tiers: pow2
  dist: [all_min, all_max]
  dtype: fp16
  seed: [0, 1, 2]
