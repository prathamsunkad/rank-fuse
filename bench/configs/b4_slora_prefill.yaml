# B4 on prompt-sized batches: 4 x 512 = 2048 and 16 x 512 = 8192 tokens, one rank per request.
# NOT how S-LoRA serves prompts: S-LoRA runs bgmv for decode only and switches to a separate
# Triton kernel for prompts (>= 200 tokens). These rows measure the bgmv kernel itself on large
# batches. Run with --timing graph.
name: b4-slora-prefill
impls: [b4_slora_copies, b4_slora_shared, rf1_fused, b3_vllm, b1_padded_graphed]
timing: graph
warmup: 10
reps: 50
graph_replays: 10
flush_l2: true
shapes:            # projection: [h_in, h_out]
  layer_4096: [4096, 4096]
  q_o: [896, 896]
  k_v: [896, 128]
  gate_up: [896, 4864]
  down: [4864, 896]
grid:
  num_requests: [4, 16]
  tokens_per_request: 512
  r_max: 64
  dist: [uniform, skew_low, all_max]
  dtype: fp16
